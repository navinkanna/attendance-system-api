AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Attendance System API - FastAPI on Lambda
Parameters:
  DatabaseUrl:
    Type: String
    NoEcho: true
Globals:
  Function:
    Timeout: 30
    MemorySize: 256
Resources:
  AttendanceApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
      - x86_64
      Environment:
        Variables:
          DATABASE_URL:
            Ref: DatabaseUrl
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
      ImageUri: attendanceapifunction:latest
    Metadata:
      DockerContext: D:\Projects\repo\attendance-system\attendance-system-api
      DockerTag: latest
      Dockerfile: Dockerfile
      SamResourceId: AttendanceApiFunction
Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value:
      Fn::Sub: https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/
